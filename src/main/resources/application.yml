spring:
  application:
    name: yu-ai-code-mother
  profiles:
    active: local
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/yu_ai_code_mother?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
  # redis
  data:
    redis:
      host: localhost  # 改为本地
      port: 6379
      database: 0
      password:
      ttl: 3600 #缓存过期时间 (秒)
  # 放宽异步请求超时，避免 SSE 流式生成中途被服务端断开（毫秒，30 分钟，Vue 工程逐文件写入耗时较长）
  mvc:
    async:
      request-timeout: 1800000
server:
  port: 8123
  servlet:
    context-path: /api
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${aliyun-api-key}
      model-name: qwen3.8-flash
      log-requests: true
      log-responses: true
      max-tokens: 16384
    #      max-retries: 3
    #      strict-json-schema: true
    #      response-format: json_object
    streaming-chat-model:
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${aliyun-api-key}
      model-name: qwen3.8-flash
      max-tokens: 16384
      log-requests: true
      log-responses: true
    #      max-retries: 1
    reasoning-chat-model:
      base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${aliyun-api-key}
      model-name: qwen3.8-flash
      max-tokens: 32768
      log-requests: true
      log-responses: true
  #      strict-json-schema: true
  #      response-format: json_object
  #      max-retries: 2
  # 智能路由 AI 模型配置
routing-chat-model:
  base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api-key: ${aliyun-api-key}
  model-name: qwen3.8-flash
  max-tokens: 1000
  log-requests: false
  log-responses: false
# 应用名称生成 AI 模型配置
generate-app-name-model:
  base-url: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  api-key: ${aliyun-api-key}
  model-name: qwen3.8-flash
  max-tokens: 1000
  log-requests: true
  log-responses: true
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host:
    secretId:
    secretKey:
    region:
    bucket:
# Pexels 图片搜索配置
pexels:
  api-key:
# 阿里云 DashScope 配置
dashscope:
  api-key:
  image-model:
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yu.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
#监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always